name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.6'

      - name: Run ruff (syntax errors, undefined names, unused imports/variables)
        run: |
          # --target-version py39 also flags syntax newer than the minimum supported Python
          ruff check . --target-version py39 --select E9,F63,F7,F82,F401,F811,F841 --exclude docs,webchat/static

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 'pytest>=7.4' 'pytest-timeout>=2.1'

      - name: Run unit tests
        run: |
          pytest tests/unit/ --timeout=60 --junitxml=pytest-report.xml

      - name: Run webchat validator tests
        working-directory: webchat
        run: |
          python test_validators.py

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.python-version }}
          path: pytest-report.xml

